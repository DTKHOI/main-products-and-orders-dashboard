<!doctype html>
<html class="h-screen {{ session.get('theme', 'light') }}" lang="{{ session.get('language', 'en') }}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>{{ _t('auth_forgot_title') }}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/input.css') }}" />
        <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}" />

        <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}" />

        <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon/favicon-32x32.png') }}" />

        <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon/favicon-16x16.png') }}" />

        <link rel="manifest" href="{{ url_for('static', filename='favicon/site.webmanifest') }}" />

        <link rel="shortcut icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}" />
    </head>
    <body class="bg-body dark:bg-slate-950 text-zinc-800 dark:text-slate-100 h-full">
        <main class="grid h-full grid-cols-1 items-center justify-center px-4">
            <div class="mx-auto flex w-full max-w-md flex-col justify-center rounded-2xl border border-gray-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6 sm:p-8 shadow-xl dark:shadow-slate-950/60">
                <div>
                    <p class="text-sm font-medium text-blue-600 dark:text-blue-400">ProductFlow</p>
                    <h1 class="mt-1 text-2xl font-bold text-zinc-800 dark:text-slate-100">{{ _t('auth_forgot_heading') }}</h1>
                    <p class="mt-1.5 text-sm text-neutral-500 dark:text-slate-400">{{ _t('auth_forgot_sub') }}</p>
                </div>

                <form id="forgot-form" action="/forgot_pass" class="mt-6 flex flex-col" method="post" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

                    <div id="email-input-group">
                        <label for="email" class="text-xs font-semibold text-zinc-800 dark:text-slate-300">{{ _t('lbl_email_addr') }}</label>
                        <div class="relative mt-1 flex h-11 items-center">
                            <input id="email" name="email" type="email" placeholder="{{ _t('ph_email_addr') }}" required class="block w-full appearance-none rounded-xl border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-950 px-4 py-3 text-sm text-zinc-800 dark:text-slate-100 placeholder-gray-400 dark:placeholder-slate-500 shadow-sm transition focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none" />
                        </div>
                        <p id="email-error" class="invisible mt-1 text-[11px] font-semibold text-red-600 dark:text-rose-400 opacity-0 transition-opacity">{{ _t('err_email_invalid') }}</p>
                    </div>

                    <button id="btn-send-otp" type="submit" class="mt-3 inline-flex h-11 cursor-pointer items-center justify-center rounded-xl bg-linear-to-r from-blue-600 to-purple-600 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-blue-500/20 dark:shadow-purple-900/40 transition hover:opacity-95 active:scale-95 disabled:cursor-not-allowed disabled:opacity-60">
                        <span>{{ _t('btn_send_otp') }}</span>
                    </button>

                    <div class="mt-6 text-center">
                        <a href="/login" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-600 dark:text-slate-400 transition hover:text-blue-600 dark:hover:text-blue-400">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 12H5M12 19l-7-7 7-7" />
                            </svg>
                            {{ _t('btn_back_login') }}
                        </a>
                    </div>
                </form>
            </div>
        </main>

        {% with messages = get_flashed_messages(with_categories=true) %} {% if messages %}
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                {% for category, message in messages %}
                    showToast("{{ message }}", "{{ category }}");
                {% endfor %}
            });
        </script>
        {% endif %} {% endwith %}

        <script src="{{ url_for('static', filename='js/forgot_password.js') }}"></script>
        <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
    </body>
</html>
