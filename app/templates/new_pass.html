<!doctype html>
<html class="h-screen {{ session.get('theme', 'light') }}" lang="{{ session.get('language', 'en') }}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>{{ _t('auth_reset_title') }}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/input.css') }}" />
        <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}" />

        <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}" />

        <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon/favicon-32x32.png') }}" />

        <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon/favicon-16x16.png') }}" />

        <link rel="manifest" href="{{ url_for('static', filename='favicon/site.webmanifest') }}" />

        <link rel="shortcut icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}" />
    </head>
    <body class="bg-body dark:bg-slate-950 text-zinc-800 dark:text-slate-100 h-full">
        <main class="grid h-full grid-cols-1 items-center justify-center px-4">
            <div class="mx-auto flex w-full max-w-md flex-col justify-center rounded-2xl border border-gray-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6 sm:p-8 shadow-xl dark:shadow-slate-950/60">
                <div>
                    <p class="text-sm font-medium text-blue-600 dark:text-blue-400">Account Recovery</p>
                    <h1 class="mt-1 text-2xl font-bold text-zinc-800 dark:text-slate-100">{{ _t('auth_reset_heading') }}</h1>
                    <p class="mt-1 text-sm text-neutral-500 dark:text-slate-400">{{ _t('auth_reset_sub') }}</p>
                </div>

                <form id="new-pass-form" action="/new_password" class="mt-6 flex flex-col" method="post" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

                    <div id="password-input">
                        <label for="password" class="text-xs font-semibold text-zinc-800 dark:text-slate-300">{{ _t('lbl_new_pass') }}</label>
                        <div class="relative mt-1 flex h-11 items-center text-neutral-500 dark:text-slate-400">
                            <input id="password" name="password" placeholder="{{ _t('ph_enter_pass') }}" class="password block w-full appearance-none rounded-xl border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-950 px-4 py-3 pr-11 text-sm text-zinc-800 dark:text-slate-100 placeholder-gray-400 dark:placeholder-slate-500 shadow-sm transition focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none" type="password" />
                            <svg id="show-pass" class="show-password fill-current absolute right-0 hidden cursor-pointer p-3" width="44" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                                <path
                                    d="M320 144C254.8 144 201.2 173.6 160.1 211.7C121.6 247.5 95 290 81.4 320C95 350 121.6 392.5 160.1 428.3C201.2 466.4 254.8 496 320 496C385.2 496 438.8 466.4 479.9 428.3C518.4 392.5 545 350 558.6 320C545 290 518.4 247.5 479.9 211.7C438.8 173.6 385.2 144 320 144zM127.4 176.6C174.5 132.8 239.2 96 320 96C400.8 96 465.5 132.8 512.6 176.6C559.4 220.1 590.7 272 605.6 307.7C608.9 315.6 608.9 324.4 605.6 332.3C590.7 368 559.4 420 512.6 463.4C465.5 507.1 400.8 544 320 544C239.2 544 174.5 507.2 127.4 463.4C80.6 419.9 49.3 368 34.4 332.3C31.1 324.4 31.1 315.6 34.4 307.7C49.3 272 80.6 220 127.4 176.6zM320 400C364.2 400 400 364.2 400 320C400 290.4 383.9 264.5 360 250.7C358.6 310.4 310.4 358.6 250.7 360C264.5 383.9 290.4 400 320 400zM240.4 311.6C242.9 311.9 245.4 312 248 312C283.3 312 312 283.3 312 248C312 245.4 311.8 242.9 311.6 240.4C274.2 244.3 244.4 274.1 240.5 311.5zM286 196.6C296.8 193.6 308.2 192.1 319.9 192.1C328.7 192.1 337.4 193 345.7 194.7C346 194.8 346.2 194.8 346.5 194.9C404.4 207.1 447.9 258.6 447.9 320.1C447.9 390.8 390.6 448.1 319.9 448.1C258.3 448.1 206.9 404.6 194.7 346.7C192.9 338.1 191.9 329.2 191.9 320.1C191.9 309.1 193.3 298.3 195.9 288.1C196.1 287.4 196.2 286.8 196.4 286.2C208.3 242.8 242.5 208.6 285.9 196.7z"
                                />
                            </svg>
                            <svg id="hide-pass" width="44" class="hide-password fill-current absolute right-0 hidden cursor-pointer p-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                                <path
                                    d="M73 39.1C63.6 29.7 48.4 29.7 39.1 39.1C29.8 48.5 29.7 63.7 39 73.1L567 601.1C576.4 610.5 591.6 610.5 600.9 601.1C610.2 591.7 610.3 576.5 600.9 567.2L504.5 470.8C507.2 468.4 509.9 466 512.5 463.6C559.3 420.1 590.6 368.2 605.5 332.5C608.8 324.6 608.8 315.8 605.5 307.9C590.6 272.2 559.3 220.2 512.5 176.8C465.4 133.1 400.7 96.2 319.9 96.2C263.1 96.2 214.3 114.4 173.9 140.4L73 39.1zM208.9 175.1C241 156.2 278.1 144 320 144C385.2 144 438.8 173.6 479.9 428.3C476.8 431.1 473.7 433.9 470.5 436.7L425.8 392C439.8 371.5 448 346.7 448 320C448 249.3 390.7 192 320 192C293.3 192 268.5 200.2 248 214.2L208.9 175.1zM390.9 357.1L282.9 249.1C294 243.3 306.6 240 320 240C364.2 240 400 275.8 400 320C400 333.4 396.7 346 390.9 357.1zM135.4 237.2L101.4 203.2C68.8 240 46.4 279 34.5 307.7C31.2 315.6 31.2 324.4 34.5 332.3C49.4 368 80.7 420 127.5 463.4C174.6 507.1 239.3 544 320.1 544C357.4 544 391.3 536.1 421.6 523.4L384.2 486C364.2 492.4 342.8 496 320 496C254.8 496 201.2 466.4 160.1 428.3C121.6 392.6 95 350 81.5 320C91.9 296.9 110.1 266.4 135.5 237.2z"
                                />
                            </svg>
                        </div>
                        <p id="password-error" class="invisible mt-1 text-[10px] font-semibold text-red-600 dark:text-rose-400 opacity-0">{{ _t('err_password_short') }}</p>
                    </div>

                    <div>
                        <label for="confirm-password" class="text-xs font-semibold text-zinc-800 dark:text-slate-300">{{ _t('lbl_conf_pass') }}</label>
                        <div class="relative mt-1 flex h-11 items-center text-neutral-500 dark:text-slate-400">
                            <input id="confirm-password" name="confirm_password" placeholder="{{ _t('ph_enter_pass') }}" class="password block w-full appearance-none rounded-xl border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-950 px-4 py-3 pr-11 text-sm text-zinc-800 dark:text-slate-100 placeholder-gray-400 dark:placeholder-slate-500 shadow-sm transition focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none" type="password" />
                            <svg id="confirm-show-pass" class="show-password fill-current absolute right-0 hidden cursor-pointer p-3" width="44" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                                <path
                                    d="M320 144C254.8 144 201.2 173.6 160.1 211.7C121.6 247.5 95 290 81.4 320C95 350 121.6 392.5 160.1 428.3C201.2 466.4 254.8 496 320 496C385.2 496 438.8 466.4 479.9 428.3C518.4 392.5 545 350 558.6 320C545 290 518.4 247.5 479.9 211.7C438.8 173.6 385.2 144 320 144zM127.4 176.6C174.5 132.8 239.2 96 320 96C400.8 96 465.5 132.8 512.6 176.6C559.4 220.1 590.7 272 605.6 307.7C608.9 315.6 608.9 324.4 605.6 332.3C590.7 368 559.4 420 512.6 463.4C465.5 507.1 400.8 544 320 544C239.2 544 174.5 507.2 127.4 463.4C80.6 419.9 49.3 368 34.4 332.3C31.1 324.4 31.1 315.6 34.4 307.7C49.3 272 80.6 220 127.4 176.6zM320 400C364.2 400 400 364.2 400 320C400 290.4 383.9 264.5 360 250.7C358.6 310.4 310.4 358.6 250.7 360C264.5 383.9 290.4 400 320 400zM240.4 311.6C242.9 311.9 245.4 312 248 312C283.3 312 312 283.3 312 248C312 245.4 311.8 242.9 311.6 240.4C274.2 244.3 244.4 274.1 240.5 311.5zM286 196.6C296.8 193.6 308.2 192.1 319.9 192.1C328.7 192.1 337.4 193 345.7 194.7C346 194.8 346.2 194.8 346.5 194.9C404.4 207.1 447.9 258.6 447.9 320.1C447.9 390.8 390.6 448.1 319.9 448.1C258.3 448.1 206.9 404.6 194.7 346.7C192.9 338.1 191.9 329.2 191.9 320.1C191.9 309.1 193.3 298.3 195.9 288.1C196.1 287.4 196.2 286.8 196.4 286.2C208.3 242.8 242.5 208.6 285.9 196.7z"
                                />
                            </svg>
                            <svg id="confirm-hide-pass" width="44" class="hide-password fill-current absolute right-0 hidden cursor-pointer p-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                                <path
                                    d="M73 39.1C63.6 29.7 48.4 29.7 39.1 39.1C29.8 48.5 29.7 63.7 39 73.1L567 601.1C576.4 610.5 591.6 610.5 600.9 601.1C610.2 591.7 610.3 576.5 600.9 567.2L504.5 470.8C507.2 468.4 509.9 466 512.5 463.6C559.3 420.1 590.6 368.2 605.5 332.5C608.8 324.6 608.8 315.8 605.5 307.9C590.6 272.2 559.3 220.2 512.5 176.8C465.4 133.1 400.7 96.2 319.9 96.2C263.1 96.2 214.3 114.4 173.9 140.4L73 39.1zM208.9 175.1C241 156.2 278.1 144 320 144C385.2 144 438.8 173.6 479.9 428.3C476.8 431.1 473.7 433.9 470.5 436.7L425.8 392C439.8 371.5 448 346.7 448 320C448 249.3 390.7 192 320 192C293.3 192 268.5 200.2 248 214.2L208.9 175.1zM390.9 357.1L282.9 249.1C294 243.3 306.6 240 320 240C364.2 240 400 275.8 400 320C400 333.4 396.7 346 390.9 357.1zM135.4 237.2L101.4 203.2C68.8 240 46.4 279 34.5 307.7C31.2 315.6 31.2 324.4 34.5 332.3C49.4 368 80.7 420 127.5 463.4C174.6 507.1 239.3 544 320.1 544C357.4 544 391.3 536.1 421.6 523.4L384.2 486C364.2 492.4 342.8 496 320 496C254.8 496 201.2 466.4 160.1 428.3C121.6 392.6 95 350 81.5 320C91.9 296.9 110.1 266.4 135.5 237.2z"
                                />
                            </svg>
                        </div>
                        <p id="confirm-error" class="invisible mt-1 text-[10px] font-semibold text-red-600 dark:text-rose-400 opacity-0">{{ _t('err_password_mismatch') }}</p>
                    </div>

                    <button id="change_pass" type="submit" class="mt-2 inline-flex h-11 cursor-pointer items-center justify-center rounded-xl bg-linear-to-r from-blue-600 to-purple-600 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-blue-500/20 dark:shadow-purple-900/40 transition hover:opacity-95 active:scale-95">{{ _t('btn_update_pass') }}</button>
                </form>
            </div>
        </main>

        {% with messages = get_flashed_messages(with_categories=true) %} {% if messages %}
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                {% for category, message in messages %}
                    showToast("{{ message }}", "{{ category }}");
                {% endfor %}
            });
        </script>
        {% endif %} {% endwith %}
        <script src="{{ url_for('static', filename='js/password.js') }}"></script>
        <script src="{{ url_for('static', filename='js/forgot_password.js') }}"></script>
        <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
    </body>
</html>
