<!doctype html>
<html class="h-screen {{ session.get('theme', 'light') }}" lang="{{ session.get('language', 'en') }}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>{{ _t('auth_otp_title') }}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/input.css') }}" />
        <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}" />

        <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}" />

        <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon/favicon-32x32.png') }}" />

        <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon/favicon-16x16.png') }}" />

        <link rel="manifest" href="{{ url_for('static', filename='favicon/site.webmanifest') }}" />

        <link rel="shortcut icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}" />
    </head>
    <body class="bg-body dark:bg-slate-950 text-zinc-800 dark:text-slate-100 h-full">
        <main class="grid h-full grid-cols-1 items-center justify-center px-4">
            <div class="mx-auto flex w-full max-w-md flex-col justify-center rounded-2xl border border-gray-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6 sm:p-8 shadow-xl dark:shadow-slate-950/60">
                <div>
                    <p class="text-sm font-medium text-blue-600 dark:text-blue-400">Security Verification</p>
                    <h1 class="mt-1 text-2xl font-bold text-zinc-800 dark:text-slate-100">{{ _t('auth_otp_heading') }}</h1>
                    <p class="mt-1.5 text-sm text-neutral-500 dark:text-slate-400">
                        {{ _t('auth_otp_sub') }}
                        <span class="font-semibold text-zinc-800 dark:text-slate-200">{{ session.get('reset_email', '') }}</span>.
                    </p>
                </div>

                <form id="otp-form" action="/confirm_otp" class="mt-6 flex flex-col" method="post" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                    <input type="hidden" id="otp-hidden" name="otp_code" />

                    <label class="text-xs font-semibold text-zinc-800 dark:text-slate-300">{{ _t('lbl_otp_code') }}</label>
                    <div id="otp-inputs" class="mt-2 grid grid-cols-6 gap-2 sm:gap-3">
                        <input type="text" inputmode="numeric" maxlength="1" class="otp-box h-12 w-full rounded-xl border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-center text-lg font-bold text-zinc-800 dark:text-slate-100 shadow-sm transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 focus:outline-none" />
                        <input type="text" inputmode="numeric" maxlength="1" class="otp-box h-12 w-full rounded-xl border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-center text-lg font-bold text-zinc-800 dark:text-slate-100 shadow-sm transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 focus:outline-none" />
                        <input type="text" inputmode="numeric" maxlength="1" class="otp-box h-12 w-full rounded-xl border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-center text-lg font-bold text-zinc-800 dark:text-slate-100 shadow-sm transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 focus:outline-none" />
                        <input type="text" inputmode="numeric" maxlength="1" class="otp-box h-12 w-full rounded-xl border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-center text-lg font-bold text-zinc-800 dark:text-slate-100 shadow-sm transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 focus:outline-none" />
                        <input type="text" inputmode="numeric" maxlength="1" class="otp-box h-12 w-full rounded-xl border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-center text-lg font-bold text-zinc-800 dark:text-slate-100 shadow-sm transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 focus:outline-none" />
                        <input type="text" inputmode="numeric" maxlength="1" class="otp-box h-12 w-full rounded-xl border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-center text-lg font-bold text-zinc-800 dark:text-slate-100 shadow-sm transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 focus:outline-none" />
                    </div>
                    <p id="otp-error" class="invisible mt-1.5 text-[11px] font-semibold text-red-600 dark:text-rose-400 opacity-0 transition-opacity">{{ _t('err_otp_incomplete') }}</p>

                    <button id="btn-verify-otp" type="submit" class="mt-3 inline-flex h-11 cursor-pointer items-center justify-center rounded-xl bg-linear-to-r from-blue-600 to-purple-600 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-blue-500/20 dark:shadow-purple-900/40 transition hover:opacity-95 active:scale-95">{{ _t('btn_verify_otp') }}</button>
                </form>

                <div class="mt-5 flex items-center justify-between text-xs text-neutral-500 dark:text-slate-400">
                    <span>{{ _t('lbl_didnt_receive') }}</span>
                    <form action="/confirm_otp" method="post" class="inline">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                        <input type="hidden" name="action" value="resend" />
                        <button id="btn-resend-otp" type="submit" disabled class="cursor-pointer font-semibold text-blue-600 dark:text-blue-400 transition hover:underline disabled:cursor-not-allowed disabled:text-gray-400 dark:disabled:text-slate-600 disabled:no-underline">{{ _t('lbl_resend_countdown') }} (<span id="otp-timer">60</span>s)</button>
                    </form>
                </div>
            </div>
        </main>

        {% with messages = get_flashed_messages(with_categories=true) %} {% if messages %}
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                {% for category, message in messages %}
                    showToast("{{ message }}", "{{ category }}");
                {% endfor %}
            });
        </script>
        {% endif %} {% endwith %}

        <script src="{{ url_for('static', filename='js/forgot_password.js') }}"></script>
        <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
    </body>
</html>
